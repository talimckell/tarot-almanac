<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 292" role="img" aria-label="A four-step arithmetic walk. The digits of 2014 add to seven. Adding the month, six, gives thirteen. Adding the day, fourteen, gives twenty-seven. Twenty-seven is past the end of a twenty-two card wheel, so it comes around to five, the Hierophant."><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+SC:wght@400;500&amp;family=Lato:wght@300;400&amp;display=swap");</style></defs><text x="260" y="32" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="16" letter-spacing="2.4" fill="#5f5648">ONE DATE, ONE CARD</text><text x="260" y="60" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="17" fill="#4a3e30">14 June 2014, kept whole.</text><text x="78" y="88" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" letter-spacing="1.1" fill="#5f5648">THE YEAR'S DIGITS</text><text x="78" y="110" text-anchor="middle" font-family="'Lato',system-ui,sans-serif" font-weight="300" font-size="14.5" fill="#b8a890">2 + 0 + 1 + 4</text><circle cx="78" cy="144" r="21" fill="none" stroke="#1e3a58" stroke-width="1.3"/><text x="78" y="144" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="21" fill="#1e3a58">7</text><path d="M 106 144 L 188 144" stroke="#b8a890" stroke-width="1"/><path d="M 182 139 L 188 144 L 182 149" fill="none" stroke="#b8a890" stroke-width="1"/><text x="218" y="88" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" letter-spacing="1.1" fill="#5f5648">ADD THE MONTH</text><text x="218" y="110" text-anchor="middle" font-family="'Lato',system-ui,sans-serif" font-weight="300" font-size="14.5" fill="#b8a890">7 + 6</text><circle cx="218" cy="144" r="21" fill="none" stroke="#1e3a58" stroke-width="1.3"/><text x="218" y="144" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="21" fill="#1e3a58">13</text><path d="M 246 144 L 328 144" stroke="#b8a890" stroke-width="1"/><path d="M 322 139 L 328 144 L 322 149" fill="none" stroke="#b8a890" stroke-width="1"/><text x="358" y="88" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" letter-spacing="1.1" fill="#5f5648">ADD THE DAY</text><text x="358" y="110" text-anchor="middle" font-family="'Lato',system-ui,sans-serif" font-weight="300" font-size="14.5" fill="#b8a890">13 + 14</text><circle cx="358" cy="144" r="21" fill="none" stroke="#1e3a58" stroke-width="1.3"/><text x="358" y="144" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="21" fill="#1e3a58">27</text><path d="M 358 168 L 358 210" stroke="#b83820" stroke-width="1.2" stroke-dasharray="4 3"/><text x="346" y="196" text-anchor="end" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="16.5" fill="#b83820">past the end of the wheel, so 27 − 22</text><circle cx="358" cy="232" r="21" fill="#b83820"/><text x="358" y="232" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="21" fill="#f6f2eb">5</text><text x="326" y="232" text-anchor="end" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="22" fill="#4a3e30">The Hierophant</text></svg>