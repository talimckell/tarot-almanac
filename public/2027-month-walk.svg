serif" font-size="15" fill="#f6f2eb">19</text><circle cx="642.2857200000001" cy="258" r="13" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.2"/><text x="642.2857200000001" y="258" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">20</text><circle cx="672.000006" cy="258" r="13" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.2"/><text x="672.000006" y="258" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">21</text><circle cx="374.857146" cy="258" r="16.5" fill="none" stroke="#b83820" stroke-width="1.8"/><text x="374.857146" y="292" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" letter-spacing="1.4" fill="#b83820">THE YEAR</text><text x="374.857146" y="312" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="18" fill="#b83820">Justice</text><text x="48" y="292" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="17" fill="#5f5648">Fool</text><text x="672.000006" y="292" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="17" fill="#5f5648">World</text><path d="M 478.71429 326 L 478.71429 334 L 687.000006 334 L 687.000006 326" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="582.857148" y="356" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" letter-spacing="1.4" fill="#5f5648">THE RECKONING STRETCH</text><text x="360" y="414" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="18.5" fill="#4a3e30">April through October, seven months of it, the most a year can hold.</text></svg>