<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="The twenty-two Major Arcana in a row, numbered zero to twenty-one. Justice at eleven is ringed as the card for 2027. The twelve collective month cards are filled: January at the Hanged One, twelve, running forward one card a month to October at the World, twenty-one. An arc then runs back to the start, where November fills the Fool at zero and December the Magician at one."><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+SC:wght@400;500&amp;family=Lato:wght@300;400&amp;display=swap");</style></defs><text x="360" y="34" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="18" letter-spacing="2.8" fill="#5f5648">2027, MONTH BY MONTH</text><text x="360" y="63" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="20" fill="#4a3e30">Twelve months from a year that starts past the middle of the deck.</text><text x="360.000003" y="106" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="18" fill="#b83820">the deck runs out in October, so November starts it over</text><path d="M 672.000006 200 C 672.000006 122, 48 122, 48 200" fill="none" stroke="#b83820" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 43 192 L 48 202 L 53 192" fill="none" stroke="#b83820" stroke-width="1.5"/><text x="48" y="234" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">NOV</text><text x="77.714286" y="216" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">DEC</text><text x="404.571432" y="234" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">JAN</text><text x="434.28571800000003" y="216" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">FEB</text><text x="464.000004" y="234" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">MAR</text><text x="493.71429" y="216" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">APR</text><text x="523.428576" y="234" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">MAY</text><text x="553.142862" y="216" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">JUN</text><text x="582.857148" y="234" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">JUL</text><text x="612.5714340000001" y="216" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">AUG</text><text x="642.2857200000001" y="234" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">SEP</text><text x="672.000006" y="216" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13" fill="#1e3a58">OCT</text><circle cx="48" cy="258" r="13" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.2"/><text x="48" y="258" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">0</text><circle cx="77.714286" cy="258" r="13" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.2"/><text x="77.714286" y="258" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">1</text><circle cx="107.428572" cy="258" r="12" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="107.428572" y="258" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="14" fill="#b8a890">2</text><circle cx="137.142858" cy="258" r="12" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="137.142858" y="258" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-s