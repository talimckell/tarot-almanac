ant',Georgia,serif" font-style="italic" font-size="16.5" fill="#1e3a58">the eleven stays where it is</text><path d="M 374.857146 290 L 374.857146 297" fill="none" stroke="#1e3a58" stroke-width="1.3"/><circle cx="48" cy="316" r="13" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.2"/><text x="48" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#f6f2eb">0</text><circle cx="77.714286" cy="316" r="13" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.2"/><text x="77.714286" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#f6f2eb">1</text><circle cx="107.428572" cy="316" r="13" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.2"/><text x="107.428572" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#f6f2eb">2</text><circle cx="137.142858" cy="316" r="13" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.2"/><text x="137.142858" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#f6f2eb">3</text><circle cx="166.857144" cy="316" r="13" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.2"/><text x="166.857144" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#f6f2eb">4</text><circle cx="196.57143000000002" cy="316" r="13" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.2"/><text x="196.57143000000002" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#f6f2eb">5</text><circle cx="226.285716" cy="316" r="13" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.2"/><text x="226.285716" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#f6f2eb">6</text><circle cx="256.000002" cy="316" r="13" fill="#1e3a58" stroke="#1e