<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Two rows of the twenty-two Major Arcana. In the top row, reduced to one digit, only cards one through nine are filled and a dashed arc runs from the empty eleven back to card two, the High Priestess, where 2027 lands. In the bottom row, kept on the wheel, all twenty-two cards are filled and 2027 stays at card eleven, Justice."><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+SC:wght@400;500&amp;family=Lato:wght@300;400&amp;display=swap");</style></defs><text x="360" y="34" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="19" letter-spacing="2.8" fill="#5f5648">ONE ELEVEN, TWO SYSTEMS</text><text x="360" y="64" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="21" fill="#4a3e30">The digits of 2027 add up to 11. What happens next is a choice.</text><text x="48" y="100" font-family="'Cormorant SC',Georgia,serif" font-size="16" letter-spacing="1.6" fill="#1e3a58">REDUCED TO ONE DIGIT</text><text x="672" y="100" text-anchor="end" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="17" fill="#5f5648">nine places to stand</text><text x="241.142859" y="124" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="16.5" fill="#1e3a58">the eleven falls back to the two</text><path d="M 374.857146 156 C 374.857146 126, 107.428572 126, 107.428572 156" fill="none" stroke="#1e3a58" stroke-width="1.3" stroke-dasharray="3 2.5"/><path d="M 103.428572 150 L 107.428572 158 L 111.428572 150" fill="none" stroke="#1e3a58" stroke-width="1.3"/><circle cx="48" cy="178" r="12" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="48" y="178" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">0</text><circle cx="77.714286" cy="178" r="13" fill=