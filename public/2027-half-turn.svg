<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 648" role="img" aria-label="The twenty-two Major Arcana arranged in a circle. Three birthdays are drawn as straight lines through the centre of the wheel, each joining a Bearing card to that birthday's 2027 card: March 15 from the Moon at eighteen to the Chariot at seven, January 1 from the High Priestess at two to Death at thirteen, and December 25 from the Devil at fifteen to the Emperor at four. Each line passes through the middle, because eleven steps is exactly half of twenty-two."><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+SC:wght@400;500&amp;family=Lato:wght@300;400&amp;display=swap");</style></defs><text x="360" y="34" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="18" letter-spacing="2.8" fill="#5f5648">2027 STANDS EVERYONE ACROSS THE WHEEL</text><text x="360" y="63" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="20" fill="#4a3e30">Eleven steps is half of twenty-two, so the move is a straight line.</text><line x1="225.3744646875313" y1="230.5185780757208" x2="494.62553531246874" y2="353.4814219242792" stroke="#b83820" stroke-width="1.6" stroke-opacity="0.85"/><line x1="440.0148409834285" y1="167.4944771409852" x2="279.9851590165715" y2="416.50552285901483" stroke="#1e3a58" stroke-width="1.6" stroke-opacity="0.85"/><line x1="225.37446468753132" y1="353.48142192427923" x2="494.62553531246874" y2="230.51857807572082" stroke="#3a5a38" stroke-width="1.6" stroke-opacity="0.85"/><circle cx="360" cy="144" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="360" y="144" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">0</text><circle cx="401.69641841253156" cy="149.99503990505437" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="401.69641841253156" y="149.99503990505437" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">1</text><circle cx="440.0148409834285" cy="167.4944771409852" r="15" fill="#f6f2eb" stroke="#1e3a58" stroke-width="1.8"/><text x="440.0148409834285" y="167.4944771409852" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#1e3a58">2</text><circle cx="471.85093700443025" cy="195.0806113760978" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="471.85093700443025" y="195.0806113760978" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">3</text><circle cx="494.62553531246874" cy="230.51857807572082" r="15" fill="#3a5a38" stroke="#3a5a38" stroke-width="1.8"/><text x="494.62553531246874" y="230.51857807572082" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">4</text><circle cx="506.49357339837803" cy="270.9374039355538" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="506.49357339837803" y="270.9374039355538" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">5</text><circle cx="506.49357339837803" cy="313.0625960644462" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="506.49357339837803" y="313.0625960644462" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">6</text><circle cx="494.62553531246874" cy="353.4814219242792" r="15" fill="#b83820" stroke="#b83820" stroke-width="1.8"/><text x="494.62553531246874" y="353.4814219242792" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">7</text><circle cx="471.85093700443025" cy="388.9193886239022" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="471.85093700443025" y="388.9193886239022" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">8</text><circle cx="440.0148409834284" cy="416.50552285901483" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="440.0148409834284" y="416.50552285901483" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">9</text><circle cx="401.6964184125316" cy="434.0049600949456" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="401.6964184125316" y="434.0049600949456" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">10</text><circle cx="360" cy="440" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="360" y="440" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">11</text><circle cx="318.3035815874684" cy="434.0049600949456" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="318.3035815874684" y="434.0049600949456" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">12</text><circle cx="279.9851590165715" cy="416.50552285901483" r="15" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.8"/><text x="279.9851590165715" y="416.50552285901483" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">13</text><circle cx="248.1490629955698" cy="388.9193886239022" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="248.1490629955698" y="388.9193886239022" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">14</text><circle cx="225.37446468753132" cy="353.48142192427923" r="15" fill="#f6f2eb" stroke="#3a5a38" stroke-width="1.8"/><text x="225.37446468753132" y="353.48142192427923" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#3a5a38">15</text><circle cx="213.50642660162197" cy="313.0625960644462" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="213.50642660162197" y="313.0625960644462" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">16</text><circle cx="213.50642660162197" cy="270.9374039355538" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="213.50642660162197" y="270.9374039355538" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">17</text><circle cx="225.3744646875313" cy="230.5185780757208" r="15" fill="#f6f2eb" stroke="#b83820" stroke-width="1.8"/><text x="225.3744646875313" y="230.5185780757208" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b83820">18</text><circle cx="248.1490629955697" cy="195.08061137609786" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="248.1490629955697" y="195.08061137609786" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">19</text><circle cx="279.98515901657146" cy="167.49447714098525" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="279.98515901657146" y="167.49447714098525" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">20</text><circle cx="318.3035815874684" cy="149.9950399050544" r="14" fill="#f6f2eb" stroke="#b8a890" stroke-width="1.2"/><text x="318.3035815874684" y="149.9950399050544" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">21</text><text x="118" y="506" font-family="'Cormorant SC',Georgia,serif" font-size="13" letter-spacing="1.4" fill="#5f5648">OPEN CIRCLE, THE BEARING · FILLED, THE 2027 CARD</text><line x1="118" y1="527" x2="144" y2="527" stroke="#b83820" stroke-width="1.6"/><text x="156" y="532" font-family="'Cormorant',Georgia,serif" font-size="18.5" fill="#4a3e30">March 15: Moon <tspan fill="#5f5648">(18)</tspan> to Chariot <tspan fill="#5f5648">(7)</tspan>, 11 steps</text><line x1="118" y1="553" x2="144" y2="553" stroke="#1e3a58" stroke-width="1.6"/><text x="156" y="558" font-family="'Cormorant',Georgia,serif" font-size="18.5" fill="#4a3e30">January 1: High Priestess <tspan fill="#5f5648">(2)</tspan> to Death <tspan fill="#5f5648">(13)</tspan>, 11 steps</text><line x1="118" y1="579" x2="144" y2="579" stroke="#3a5a38" stroke-width="1.6"/><text x="156" y="584" font-family="'Cormorant',Georgia,serif" font-size="18.5" fill="#4a3e30">December 25: Devil <tspan fill="#5f5648">(15)</tspan> to Emperor <tspan fill="#5f5648">(4)</tspan>, 11 steps</text><text x="360" y="632" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="18" fill="#5f5648">Every birthday makes the same line. Only where it sits changes.</text></svg>