<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 592" role="img" aria-label="The twenty-two Major Arcana arranged in a circle. The Wheel of Fortune at ten is marked as the card everyone shares in 2026. The Moon at eighteen is marked as the Bearing for a March 15 birthday. A dashed arc runs ten steps clockwise from the Moon, past the top of the wheel, to the Lovers at six, which is that birthday's 2026 card. The distance from the Wheel of Fortune to the Lovers is eighteen steps, the same as the Bearing."><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+SC:wght@400;500&amp;family=Lato:wght@300;400&amp;display=swap");</style></defs><text x="360" y="34" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="18" letter-spacing="2.8" fill="#5f5648">WHERE A YEAR CARD COMES FROM</text><text x="360" y="63" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="20" fill="#4a3e30">Your Bearing, advanced by the card the world is under.</text><path d="M 270.8560644552572 247.28932872581512 A 98 98 0 0 1 457.0025013043314 301.946854150782" fill="none" stroke="#b83820" stroke-width="1.6" stroke-dasharray="4 3"/><g transform="translate(457.0025013043314 301.946854150782) rotate(8.181818181818187)"><path d="M -6 -8 L 0 0 L 6 -8" fill="none" stroke="#b83820" stroke-width="1.6"/></g><text x="376.34048829680296" y="232.34940753035914" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="19" fill="#b83820">+10 steps</text><circle cx="360" cy="146" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="360" y="146" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">0</text><circle cx="400.006023071483" cy="151.75199774674135" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="400.006023071483" y="151.75199774674135" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">1</text><circle cx="436.77099607869485" cy="168.5419983379723" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="436.77099607869485" y="168.5419983379723" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">2</text><circle cx="467.3164395583047" cy="195.00977577976954" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="467.3164395583047" y="195.00977577976954" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">3</text><circle cx="489.16774334034164" cy="229.01106815373214" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="489.16774334034164" y="229.01106815373214" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">4</text><circle cx="500.5546447470924" cy="267.7912929651935" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="500.5546447470924" y="267.7912929651935" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">5</text><circle cx="500.5546447470924" cy="308.2087070348065" r="15" fill="#b83820" stroke="#b83820" stroke-width="1.3"/><text x="500.5546447470924" y="308.2087070348065" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">6</text><circle cx="489.16774334034164" cy="346.98893184626786" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="489.16774334034164" y="346.98893184626786" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">7</text><circle cx="467.3164395583047" cy="380.99022422023046" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="467.3164395583047" y="380.99022422023046" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">8</text><circle cx="436.77099607869485" cy="407.45800166202775" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="436.77099607869485" y="407.45800166202775" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">9</text><circle cx="400.006023071483" cy="424.2480022532586" r="15" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.3"/><text x="400.006023071483" y="424.2480022532586" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">10</text><circle cx="360" cy="430" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="360" y="430" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">11</text><circle cx="319.993976928517" cy="424.2480022532586" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="319.993976928517" y="424.2480022532586" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">12</text><circle cx="283.22900392130515" cy="407.4580016620277" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="283.22900392130515" y="407.4580016620277" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">13</text><circle cx="252.68356044169533" cy="380.9902242202305" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="252.68356044169533" y="380.9902242202305" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">14</text><circle cx="230.8322566596584" cy="346.9889318462679" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="230.8322566596584" y="346.9889318462679" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">15</text><circle cx="219.44535525290755" cy="308.2087070348065" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="219.44535525290755" y="308.2087070348065" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">16</text><circle cx="219.44535525290755" cy="267.79129296519346" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="219.44535525290755" y="267.79129296519346" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">17</text><circle cx="230.83225665965838" cy="229.0110681537321" r="15" fill="none" stroke="#4a3e30" stroke-width="2"/><text x="230.83225665965838" y="229.0110681537321" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#4a3e30">18</text><circle cx="252.68356044169525" cy="195.0097757797696" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="252.68356044169525" y="195.0097757797696" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">19</text><circle cx="283.22900392130504" cy="168.54199833797233" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="283.22900392130504" y="168.54199833797233" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">20</text><circle cx="319.993976928517" cy="151.75199774674138" r="14" fill="none" stroke="#b8a890" stroke-width="1.3"/><text x="319.993976928517" y="151.75199774674138" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#b8a890">21</text><text x="407.3310695493602" y="469.1948195672355" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="13.5" letter-spacing="1.4" fill="#1e3a58">EVERYONE, 2026</text><text x="407.3310695493602" y="491.1948195672355" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="19" fill="#1e3a58">Wheel of Fortune</text><text x="201.18182478044093" y="204.21027781568307" text-anchor="end" font-family="'Cormorant SC',Georgia,serif" font-size="13.5" letter-spacing="1.4" fill="#4a3e30">YOUR BEARING</text><text x="201.18182478044093" y="226.21027781568307" text-anchor="end" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="19" fill="#4a3e30">Moon</text><text x="532.2900022359967" y="331.9088928299119" text-anchor="start" font-family="'Cormorant SC',Georgia,serif" font-size="13.5" letter-spacing="1.4" fill="#b83820">YOUR 2026 CARD</text><text x="532.2900022359967" y="353.9088928299119" text-anchor="start" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="19" fill="#b83820">Lovers</text><text x="360" y="540" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="19" fill="#4a3e30">18 + 10 = 28, which wraps to 6.</text><text x="360" y="570" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="18" fill="#5f5648">And from Wheel of Fortune round to Lovers is 18 steps: the Bearing again.</text></svg>