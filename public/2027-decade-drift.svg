<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Two tracks plotted from 2020 to 2030. The reduced number and the wheel card run along the same line from 2020 to 2025. In 2026 the reduced track drops to one while the wheel track climbs to ten, and the two stay apart through 2029. In 2030 both return to five and the tracks meet again."><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+SC:wght@400;500&amp;family=Lato:wght@300;400&amp;display=swap");</style></defs><text x="360" y="34" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="19" letter-spacing="2.8" fill="#5f5648">SIX YEARS OF AGREEMENT, THEN FOUR OF DRIFT</text><text x="360" y="64" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="21" fill="#4a3e30">The card each method names, year by year.</text><rect x="389.20000000000005" y="92" width="227.60000000000002" height="248" fill="#b8a890" fill-opacity="0.16"/><text x="503.00000000000006" y="110" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="15" letter-spacing="1.6" fill="#5f5648">THEY DISAGREE</text><polyline points="74,268.4 131.2,253 188.4,237.6 245.60000000000002,222.2 302.8,206.8 360,191.4 417.20000000000005,176 474.40000000000003,160.6 531.6,145.2 588.8000000000001,129.79999999999998 646,253" fill="none" stroke="#1e3a58" stroke-width="2.1"/><polyline points="74,268.4 131.2,253 188.4,237.6 245.60000000000002,222.2 302.8,206.8 360,191.4 417.20000000000005,314.6 474.40000000000003,299.2 531.6,283.8 588.8000000000001,268.4 646,253" fill="none" stroke="#9a7820" stroke-width="2.1" stroke-dasharray="5 3"/><circle cx="74" cy="268.4" r="5" fill="#1e3a58"/><text x="74" y="358" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#5f5648">2020</text><circle cx="131.2" cy="253" r="5" fill="#1e3a58"/><text x="131.2" y="358" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#5f5648">2021</text><circle cx="188.4" cy="237.6" r="5" fill="#1e3a58"/><text x="188.4" y="358" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#5f5648">2022</text><circle cx="245.60000000000002" cy="222.2" r="5" fill="#1e3a58"/><text x="245.60000000000002" y="358" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#5f5648">2023</text><circle cx="302.8" cy="206.8" r="5" fill="#1e3a58"/><text x="302.8" y="358" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#5f5648">2024</text><circle cx="360" cy="191.4" r="5" fill="#1e3a58"/><text x="360" y="358" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#5f5648">2025</text><circle cx="417.20000000000005" cy="176" r="5" fill="#1e3a58"/><circle cx="417.20000000000005" cy="314.6" r="5" fill="#9a7820"/><text x="417.20000000000005" y="358" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#4a3e30">2026</text><circle cx="474.40000000000003" cy="160.6" r="5" fill="#1e3a58"/><circle cx="474.40000000000003" cy="299.2" r="5" fill="#9a7820"/><text x="474.40000000000003" y="358" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#4a3e30">2027</text><circle cx="531.6" cy="145.2" r="5" fill="#1e3a58"/><circle cx="531.6" cy="283.8" r="5" fill="#9a7820"/><text x="531.6" y="358" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#4a3e30">2028</text><circle cx="588.8000000000001" cy="129.79999999999998" r="5" fill="#1e3a58"/><circle cx="588.8000000000001" cy="268.4" r="5" fill="#9a7820"/><text x="588.8000000000001" y="358" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#4a3e30">2029</text><circle cx="646" cy="253" r="5" fill="#1e3a58"/><text x="646" y="358" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="16" fill="#5f5648">2030</text><path d="M 474.40000000000003 291.2 L 474.40000000000003 168.6" fill="none" stroke="#b83820" stroke-width="1.3" stroke-dasharray="3 2.5"/><circle cx="474.40000000000003" cy="160.6" r="9" fill="none" stroke="#b83820" stroke-width="1.8"/><circle cx="474.40000000000003" cy="299.2" r="9" fill="none" stroke="#b83820" stroke-width="1.8"/><text x="488.40000000000003" y="234.89999999999998" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="16" fill="#b83820">9 cards apart</text><text x="96" y="176" font-family="'Cormorant SC',Georgia,serif" font-size="15" letter-spacing="1.4" fill="#1e3a58">ON THE WHEEL</text><text x="588.8000000000001" y="302.4" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="15" letter-spacing="1.4" fill="#9a7820">REDUCED</text><text x="450.40000000000003" y="166.6" text-anchor="end" font-family="'Cormorant',Georgia,serif" font-size="18" fill="#1e3a58">11</text><text x="450.40000000000003" y="305.2" text-anchor="end" font-family="'Cormorant',Georgia,serif" font-size="18" fill="#9a7820">2</text><text x="360" y="175.4" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="16" fill="#5f5648">one line, six years</text><text x="474.40000000000003" y="140.6" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="16" fill="#1e3a58">Justice</text><text x="360" y="388" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="18.5" fill="#4a3e30">Nothing to reduce until 2026. Then four years, four cards, and in 2030 the gap closes.</text></svg>