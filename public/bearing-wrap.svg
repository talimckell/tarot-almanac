<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" role="img" aria-label="The twenty-two Major Arcana arranged in a ring, the Fool at zero at the top and the World at twenty-one just before it. A line sweeps clockwise from zero all the way around the ring and returns to zero, marking the twenty-two steps that a February 20 birthday counts out. The starting and finishing card are the same card, the Fool."><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+SC:wght@400;500&amp;family=Lato:wght@300;400&amp;display=swap");</style></defs>
<text x="260" y="34" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="15" letter-spacing="2.5" fill="#5f5648">ALL THE WAY AROUND</text><text x="260" y="61" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="17" fill="#4a3e30">February 20 counts 22 steps and arrives where it started.</text><path d="M 260 142 A 120 120 0 1 1 237.85 144.06" fill="none" stroke="#1e3a58" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M 239.62 136.99 L 248.62 141.99 L 241.62 147.99 Z" fill="#1e3a58"/><circle cx="260" cy="112" r="15" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.4"/><text x="260" y="112" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="14" fill="#f6f2eb">0</text><circle cx="302.26" cy="118.08" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="302.26" y="118.08" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">1</text><circle cx="341.1" cy="135.81" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="341.1" y="135.81" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">2</text><circle cx="373.36" cy="163.77" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="373.36" y="163.77" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">3</text><circle cx="396.44" cy="199.69" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="396.44" y="199.69" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">4</text><circle cx="408.47" cy="240.65" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="408.47" y="240.65" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">5</tex