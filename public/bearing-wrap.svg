" stroke-width="1.2"/><text x="146.64" y="360.23" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">14</text><circle cx="123.56" cy="324.31" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="123.56" y="324.31" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">15</text><circle cx="111.53" cy="283.35" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="111.53" y="283.35" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">16</text><circle cx="111.53" cy="240.65" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="111.53" y="240.65" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">17</text><circle cx="123.56" cy="199.69" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="123.56" y="199.69" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">18</text><circle cx="146.64" cy="163.77" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="146.64" y="163.77" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">19</text><circle cx="178.9" cy="135.81" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="178.9" y="135.81" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">20</text><circle cx="217.74" cy="118.08" r="11" fill="none" stroke="#b8a890" stroke-width="1.2"/><text x="217.74" y="118.08" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="12" fill="#b8a890">21</text><text x="260" y="246" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-size="21" fill="#4a3e30">2 + 20 = 22</text><text x="260" y="276" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="16" fill="#1e3a58">The Fool</text><text x="260" y="436" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="14" fill="#5f5648">There are twenty-two cards, and the first one is numbered zero.</text><text x="260" y="456" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="14" fill="#5f5648">A sum of 22 lands on the card it set out from.</text>
</svg>
