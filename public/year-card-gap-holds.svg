ily="'Cormorant',Georgia,serif" font-size="20" fill="#4a3e30">2027</text><circle cx="176" cy="266" r="15" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.4"/><text x="176" y="266" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">11</text><text x="198" y="266" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="18" fill="#5f5648">Justice</text><circle cx="396" cy="266" r="15" fill="#b83820" stroke="#b83820" stroke-width="1.4"/><text x="396" y="266" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">7</text><text x="418" y="266" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="18" fill="#5f5648">Chariot</text><text x="646" y="266" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="21" fill="#4a3e30">18</text><line x1="60" y1="295" x2="672" y2="295" stroke="#b8a890" stroke-width="0.6" stroke-opacity="0.55"/><text x="86" y="324" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="20" fill="#4a3e30">2028</text><circle cx="176" cy="324" r="15" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.4"/><text x="176" y="324" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">12</text><text x="198" y="324" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="18" fill="#5f5648">Hanged One</text><circle cx="396" cy="324" r="15" fill="#b83820" stroke="#b83820" stroke-width="1.4"/><text x="396" y="324" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">8</text><text x="418" y="324" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="18" fill="#5f5648">Strength</text><text x="646" y="324" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="21" fill="#4a3e30">18</text><path d="M 686 128 L 694 128 L 694 346 L 686 346" fill="none" stroke="#4a3e30" stroke-width="1.3"/><text x="704" y="237" text-anchor="middle" dominant-baseline="central" transform="rotate(90 704 237)" font-family="'Cormorant SC',Georgia,serif" font-size="14" letter-spacing="1.8" fill="#4a3e30">THE BEARING</text><text x="360" y="378" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="18.5" fill="#4a3e30">Both cards move every year. The 18 steps between them never do.</text></svg>