<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Four rows, one for each year from 2025 to 2028. Each row shows the Major Arcana card everyone shares that year, the card a March 15 birthday carries that year, and the distance between them. The two cards change every year. The distance is eighteen steps in all four rows, which is that birthday's Bearing."><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&amp;family=Cormorant+SC:wght@400;500&amp;family=Lato:wght@300;400&amp;display=swap");</style></defs><text x="360" y="34" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="18" letter-spacing="2.8" fill="#5f5648">THE GAP DOESN'T MOVE</text><text x="360" y="63" text-anchor="middle" font-family="'Cormorant',Georgia,serif" font-style="italic" font-size="20" fill="#4a3e30">Four years running, for the same March 15 birthday.</text><text x="86" y="118" font-family="'Cormorant SC',Georgia,serif" font-size="14" letter-spacing="1.6" fill="#5f5648">YEAR</text><text x="250" y="118" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="14" letter-spacing="1.6" fill="#1e3a58">EVERYONE'S CARD</text><text x="470" y="118" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="14" letter-spacing="1.6" fill="#b83820">MARCH 15'S CARD</text><text x="646" y="118" text-anchor="middle" font-family="'Cormorant SC',Georgia,serif" font-size="14" letter-spacing="1.6" fill="#5f5648">APART</text><line x1="60" y1="130" x2="672" y2="130" stroke="#b8a890" stroke-width="1"/><text x="86" y="150" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="20" fill="#4a3e30">2025</text><circle cx="176" cy="150" r="15" fill="#1e3a58" stroke="#1e3a58" stroke-width="1.4"/><text x="176" y="150" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant',Georgia,serif" font-size="15" fill="#f6f2eb">9</text><text x="198" y=